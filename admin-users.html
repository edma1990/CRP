<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت کاربران | LYNX OIL</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#0b0f14;color:#e8eef6;margin:0;padding:24px}main{max-width:1100px;margin:auto}.card{background:#161d28;border:1px solid #243044;border-radius:14px;padding:20px;margin-bottom:16px}h1{font-size:23px}h2{font-size:18px}label{display:block;color:#aebbd0;font-size:13px;margin:10px 0 5px}input,select{width:100%;box-sizing:border-box;background:#0e141c;border:1px solid #34445c;color:#fff;border-radius:8px;padding:10px}button{border:0;border-radius:8px;padding:10px 16px;cursor:pointer;font-weight:bold;margin:5px 0 0 5px}.primary{background:#d4a017;color:#171004}.secondary{background:#2b6cb0;color:#fff}.danger{background:#8a2d2d;color:#fff}.muted{color:#94a3b8;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13px}th,td{text-align:right;border-bottom:1px solid #29364a;padding:10px 6px}th{color:#9caec5}.hidden{display:none}.msg{padding:10px;border-radius:8px;margin:10px 0;background:#202d40}.err{color:#ff8f8f}.ok{color:#52e0a8}.pill{background:#243044;border-radius:99px;padding:4px 8px;font-size:12px}</style></head><body><main>
<div id="login" class="card"><h1>ورود مدیر سامانه</h1><p class="muted">برای مدیریت کاربران با حساب admin دیتابیس وارد شوید.</p><label>نام کاربری</label><input id="lu" autocomplete="username"><label>رمز عبور</label><input id="lp" type="password" autocomplete="current-password"><label>سؤال امنیتی: <span id="cq">در حال دریافت...</span></label><input id="cc" inputmode="numeric" autocomplete="off"><button class="secondary" id="cn" type="button">سؤال جدید</button><button class="primary" id="loginBtn">ورود</button><div id="loginMsg"></div></div>
<div id="panel" class="hidden"><div class="card"><h1>مدیریت کاربران</h1><p class="muted">ایجاد، ویرایش، تغییر رمز و فعال/غیرفعال‌کردن کاربران</p><button class="secondary" id="changeMyPassword">تغییر رمز من</button><button class="danger" id="logoutBtn">خروج</button></div>
<div class="card"><h2 id="formTitle">ایجاد کاربر جدید</h2><input type="hidden" id="uid"><div class="grid"><div><label>نام کامل</label><input id="fullName"></div><div><label>نام کاربری انگلیسی</label><input id="username" placeholder="station1"></div><div><label>نقش</label><select id="role"><option value="station">جایگاه‌دار</option><option value="sales">کارشناس فروش</option><option value="accounting">مدیر مالی</option><option value="salesManager">مدیر فروش</option><option value="commerce">مدیر بازرگانی</option><option value="loading">کارشناس بارگیری</option><option value="admin">مدیر سامانه</option></select></div></div><div class="grid"><div><label>رمز عبور <span class="muted">برای ویرایش خالی بگذارید</span></label><input id="password" type="password" minlength="8"></div><div id="stationBox"><label>شهر جایگاه</label><select id="city"></select></div><div></div></div><button class="primary" id="saveBtn">ذخیره کاربر</button><button class="secondary" id="clearBtn">فرم جدید</button><div id="formMsg"></div></div>
<div class="card"><h2>فهرست کاربران</h2><button class="secondary" id="refreshBtn">به‌روزرسانی</button><div id="tableWrap" class="muted">در حال بارگذاری...</div></div></div></main><script>
const API='api.php';let token=sessionStorage.getItem('lynx_api_token')||'';let users=[],stations=[];const $=id=>document.getElementById(id);function show(el,text,cls=''){el.className='msg '+cls;el.textContent=text}async function call(action,method='GET',data=null){const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch(API+'?action='+action,{method,headers,body:data?JSON.stringify(data):undefined});const text=await r.text();let j;try{j=JSON.parse(text)}catch(e){throw new Error('پاسخ نامعتبر از سرور — کد HTTP: '+r.status)}if(!j.ok)throw new Error(j.message||'خطا');return j}
async function captcha(){try{const j=await call('challenge');$('cq').textContent=j.question}catch(e){$('cq').textContent='خطا در دریافت سؤال'}}$('cn').onclick=()=>{$('cc').value='';captcha()};captcha();
$('loginBtn').onclick=async()=>{try{const j=await call('login','POST',{username:$('lu').value.trim(),password:$('lp').value,captcha:$('cc').value});token=j.token;sessionStorage.setItem('lynx_api_token',token);$('login').classList.add('hidden');$('panel').classList.remove('hidden');await loadAll()}catch(e){show($('loginMsg'),e.message,'err')}};
$('logoutBtn').onclick=()=>{sessionStorage.removeItem('lynx_api_token');location.reload()};$('changeMyPassword').onclick=async()=>{const current=prompt('رمز فعلی:');if(current===null)return;const next=prompt('رمز جدید حداقل ۸ کاراکتر:');if(next===null)return;const repeat=prompt('تکرار رمز جدید:');if(repeat===null)return;try{await call('change_password','POST',{current_password:current,new_password:next,repeat_password:repeat});alert('رمز با موفقیت تغییر کرد.')}catch(e){alert(e.message)}};$('role').onchange=()=>{$('stationBox').style.display=$('role').value==='station'?'block':'none'};
async function loadAll(){try{[users,stations]=await Promise.all([(await call('users')).items,(await call('stations')).items]);const cities=['تهران','کرج','مشهد','اصفهان','شیراز','تبریز','قم','اهواز','کرمان','رشت','ارومیه','یزد','همدان','کرمانشاه','بندرعباس','اراک','زاهدان','ساری','قزوین','خرم‌آباد','گرگان','اردبیل','بوشهر','سنندج','بیرجند','ایلام','شهرکرد','یاسوج','زنجان','اسلامشهر','کاشان'];$('city').innerHTML='<option value="">انتخاب شهر</option>'+cities.map(c=>`<option value="${c}">${c}</option>`).join('');render()}catch(e){show($('formMsg'),e.message,'err')}}
function render(){if(!users.length){$('tableWrap').innerHTML='<p class="muted">کاربری وجود ندارد.</p>';return}$('tableWrap').innerHTML='<table><thead><tr><th>نام</th><th>نام کاربری</th><th>نقش</th><th>جایگاه</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>'+users.map(u=>`<tr><td>${esc(u.full_name)}</td><td>${esc(u.username)}</td><td><span class="pill">${roleName(u.role)}</span></td><td>${esc(u.station_name||'—')}</td><td>${u.is_active?'فعال':'غیرفعال'}</td><td><button class="secondary" onclick="editUser(${u.id})">ویرایش</button><button class="danger" onclick="toggleUser(${u.id})">${u.is_active?'غیرفعال‌کردن':'فعال‌کردن'}</button></td></tr>`).join('')+'</tbody></table>'}function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function roleName(r){return {station:'جایگاه‌دار',sales:'کارشناس فروش',accounting:'مدیر مالی',salesManager:'مدیر فروش',commerce:'مدیر بازرگانی',loading:'کارشناس بارگیری',admin:'مدیر سامانه'}[r]||r}
window.editUser=id=>{const u=users.find(x=>+x.id===+id);if(!u)return;$('uid').value=u.id;$('fullName').value=u.full_name;$('username').value=u.username;$('username').disabled=true;$('role').value=u.role;$('role').dispatchEvent(new Event('change'));$('city').value=u.station_city||'';$('password').value='';$('formTitle').textContent='ویرایش کاربر: '+u.username;window.scrollTo({top:0,behavior:'smooth'})};window.toggleUser=async id=>{if(!confirm('وضعیت این کاربر تغییر کند؟'))return;try{await call('user_toggle','POST',{id});await loadAll()}catch(e){alert(e.message)}};
$('clearBtn').onclick=()=>{['uid','fullName','username','password'].forEach(x=>$(x).value='');$('username').disabled=false;$('formTitle').textContent='ایجاد کاربر جدید';$('role').value='station';$('role').dispatchEvent(new Event('change'));$('city').value='';$('formMsg').textContent=''};$('refreshBtn').onclick=loadAll;
$('saveBtn').onclick=async()=>{const id=$('uid').value;const data={full_name:$('fullName').value.trim(),username:$('username').value.trim(),password:$('password').value,role:$('role').value,city:$('role').value==='station'?$('city').value:null};try{if(id){data.id=id;delete data.username;if(!data.password)delete data.password;await call('user_update','POST',data)}else{if(!data.password)throw new Error('رمز عبور الزامی است');await call('user_create','POST',data)}show($('formMsg'),'کاربر با موفقیت ذخیره شد.','ok');$('clearBtn').click();await loadAll()}catch(e){show($('formMsg'),e.message,'err')}};
if(token){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadAll()}$('role').dispatchEvent(new Event('change'));
</script></body></html>
